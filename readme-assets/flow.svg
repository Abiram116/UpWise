<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- step 1: share a link -->
  <rect x="30" y="30" width="220" height="160" rx="32" fill="#cfe7da"/>
  <rect x="98" y="88" width="48" height="48" rx="14" fill="none" stroke="#0f3325" stroke-width="6"/>
  <path d="M 146 88 L 178 60" stroke="#0f3325" stroke-width="6" stroke-linecap="round"/>
  <path d="M 158 60 L 178 60 L 178 80" stroke="#0f3325" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="140" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f3325">Share it in</text>

  <path d="M 270 110 C 300 110, 300 110, 330 110" stroke="#67635d" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.5"/>

  <!-- step 2: read honestly, by an owl who actually cares -->
  <rect x="340" y="30" width="220" height="160" rx="32" fill="#f5dcc4"/>
  <circle cx="431" cy="98" r="15" fill="#fffaf2"/>
  <circle cx="434" cy="95" r="6.4" fill="#4a2a10"/>
  <circle cx="431.5" cy="92.5" r="1.9" fill="#fffaf2"/>
  <circle cx="469" cy="98" r="15" fill="#fffaf2"/>
  <circle cx="472" cy="95" r="6.4" fill="#4a2a10"/>
  <circle cx="469.5" cy="92.5" r="1.9" fill="#fffaf2"/>
  <path d="M 442 122 Q 450 119 458 122 Q 454 132.5 450 136 Q 446 132.5 442 122 Z" fill="#9a5b2a"/>
  <text x="450" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#4a2a10">Reads it, tells you</text>

  <path d="M 580 110 C 610 110, 610 110, 640 110" stroke="#67635d" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.5"/>

  <!-- step 3: nudge at the right time -->
  <rect x="650" y="30" width="220" height="160" rx="32" fill="#cfe7da"/>
  <path d="M 760 80 a 26 26 0 0 1 26 26 v 14 l 10 14 h -72 l 10 -14 v -14 a 26 26 0 0 1 26 -26 Z" fill="none" stroke="#0f3325" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 750 140 a 10 10 0 0 0 20 0" stroke="#0f3325" stroke-width="6" stroke-linecap="round" fill="none"/>
  <text x="760" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f3325">Nudges at the right time</text>
</svg>
