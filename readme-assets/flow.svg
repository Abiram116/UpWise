  <rect x="98" y="88" width="48" height="48" rx="14" fill="none" stroke="#0f3325" stroke-width="6"/>
  <path d="M 146 88 L 178 60" stroke="#0f3325" stroke-width="6" stroke-linecap="round"/>
  <path d="M 158 60 L 178 60 L 178 80" stroke="#0f3325" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="140" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f3325">Paste or share</text>

  <path d="M 270 110 C 300 110, 300 110, 330 110" stroke="#67635d" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.5"/>

  <!-- step 2: read honestly -->
