  <path d="M 450 78 L 462 100 L 486 106 L 462 112 L 450 134 L 438 112 L 414 106 L 438 100 Z" fill="#4a2a10"/>
  <circle cx="428" cy="146" r="4" fill="#4a2a10"/>
  <circle cx="442" cy="146" r="4" fill="#4a2a10"/>
  <circle cx="456" cy="146" r="4" fill="#4a2a10"/>
  <circle cx="470" cy="146" r="4" fill="#4a2a10" opacity="0.3"/>
  <circle cx="484" cy="146" r="4" fill="#4a2a10" opacity="0.3"/>
  <text x="450" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#4a2a10">Reads it, scores it</text>

  <path d="M 580 110 C 610 110, 610 110, 640 110" stroke="#67635d" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.5"/>

  <!-- step 3: nudge at the right time -->
