# Builds the Windows installer (with updater artifacts) and the signed Android APK,
# then publishes them as a GitHub Release. Trigger: push a tag like v0.2.0.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_APP_NAME, VITE_APP_EMAIL
#   (no password secret — the app never ships one; first launch asks for a PIN, see src/lib/pin.ts)
#   TAURI_SIGNING_PRIVATE_KEY            (contents of ~/.upwise-keys/updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (empty string if the key has no password)
#   ANDROID_KEYSTORE_BASE64              (base64 -w0 ~/.upwise-keys/upwise-release.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
  VITE_APP_EMAIL: ${{ secrets.VITE_APP_EMAIL }}

jobs:
  # Creates the (empty) GitHub Release first so windows/android can build and upload to it
  # in true parallel, instead of android waiting on the whole windows build to finish just
  # because tauri-action used to be the thing that created the release.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # need full history + all tags to diff against the previous release
      # generate_release_notes relies on merged PRs, which this repo doesn't use (direct
      # pushes to master) - it was silently producing zero actual bullets, just a bare
      # "Full Changelog" link. Build the notes from commit messages instead.
      - name: Build changelog from commits since the last tag
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:'- %s' "${{ github.ref_name }}")
          else
            LOG=$(git log --pretty=format:'- %s' "$PREV_TAG..${{ github.ref_name }}")
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "UpWise ${{ github.ref_name }}"
          body: |
            Windows: run the .exe installer (auto-updates from now on). Android: install the .apk.

            ## What's changed
            ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build and publish Windows installer + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "UpWise ${{ github.ref_name }}"
          releaseBody: "See the assets below. Windows: run the .exe installer (auto-updates from now on). Android: install the .apk."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # ubuntu-latest runners ship with the Android SDK preinstalled (ANDROID_HOME already set) —
      # android-actions/setup-android@v3 is unmaintained and fails trying to install the
      # long-removed legacy "tools" package, so we just use sdkmanager that's already on PATH.
      - name: Install SDK packages + NDK
        run: |
          CMDLINE_TOOLS="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | sort -V | tail -1)bin"
          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$CMDLINE_TOOLS:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          # $ANDROID_HOME is a plain OS env var on this image, not in the GitHub Actions
          # `env` expression context — write it (and NDK_HOME) via GITHUB_ENV so later
          # steps can reference them both as $VARS and as ${{ env.VAR }}.
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upwise-release.jks
          cat > $RUNNER_TEMP/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upwise-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "UPWISE_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> $GITHUB_ENV
      - name: Build signed APK (arm64)
        run: npm run tauri android build -- --apk --target aarch64 --ci
      - name: Rename APK
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk UpWise-${{ github.ref_name }}-android-arm64.apk
      - name: Upload APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: UpWise-${{ github.ref_name }}-android-arm64.apk
